name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Node & TypeScript
    runs-on: ubuntu-latest
    env:
      SMOKE: |
        import { attempt, gen, unwrap } from './dist/index.js'
        const result = gen(function* () {
          return yield* attempt(() => JSON.parse('1'), SyntaxError)
        })
        if (unwrap(result) !== 1) process.exit(1)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun test --coverage ./tests
      - id: build
        run: bun run build
      - run: bun run attw
      - run: bun run treeshake
      - run: bun run pack:test
      - name: Import the build on Node 24
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --input-type=module -e "$SMOKE"
      - name: Check types on TypeScript 5.0
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npx -y -p typescript@5.0 tsc -p tests/compat
          npx -y -p typescript@5.0 tsc -p tests/compat/tsconfig.strictest.json
      - name: Check types on TypeScript 5.9
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npx -y -p typescript@5.9 tsc -p tests/compat
          npx -y -p typescript@5.9 tsc -p tests/compat/tsconfig.strictest.json
      - name: Check types on TypeScript 7.0
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npx -y -p typescript@7.0 tsc -p tests/compat
          npx -y -p typescript@7.0 tsc -p tests/compat/tsconfig.strictest.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          node-version: 22
      - name: Import the build on Node 22
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --input-type=module -e "$SMOKE"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          node-version: 26
      - name: Import the build on Node 26
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --input-type=module -e "$SMOKE"
